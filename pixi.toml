[workspace]
authors = ["MaksHubertDabrowski <MaksDabrowski@hotmail.com>"]
channels = ["conda-forge"]
name = "webgis-uhi-project"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
start = { cmd = "uvicorn main:app --reload", cwd = "backend" }
db-check = { cmd = "python -c \"import database; print('Baza OK')\"", cwd = "backend" }

[dependencies]
python = ">=3.14.2,<3.15"
fastapi = ">=0.127.0,<0.128"
uvicorn = ">=0.40.0,<0.41"
sqlalchemy = ">=2.0.45,<3"
geoalchemy2 = ">=0.18.1,<0.19"
psycopg2 = ">=2.9.10,<3"
earthengine-api = ">=1.7.4,<2"
